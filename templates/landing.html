<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ayush Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #020617, #0f172a, #1e3a8a, #0f766e);
    background-size: 400% 400%;
    animation: bgMove 12s infinite ease;
    overflow-x: hidden;
    position: relative;
}

@keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Floating blur circles */
.circle {
    position: absolute;
    border-radius: 50%;
    filter: blur(35px);
    animation: float 8s ease-in-out infinite;
    opacity: .35;
    pointer-events: none;
}

.c1 {
    width: 220px;
    height: 220px;
    background: #00e5ff;
    top: 8%;
    left: 8%;
}

.c2 {
    width: 280px;
    height: 280px;
    background: #8b5cf6;
    right: 8%;
    bottom: 8%;
    animation-delay: 2s;
}

.c3 {
    width: 160px;
    height: 160px;
    background: #14b8a6;
    top: 60%;
    left: 50%;
    animation-delay: 4s;
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-30px); }
}

/* Clock & Redirect Widget */
.clock-container {
    position: absolute;
    top: 25px;
    right: 35px;
    text-align: right;
    padding: 14px 22px;
    border-radius: 18px;
    background: rgba(255, 255, 255, .08);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(0, 255, 255, .3);
    box-shadow: 0 0 20px rgba(0, 255, 255, .25);
    z-index: 10;
}

#clock {
    font-size: 26px;
    font-weight: bold;
    color: #00ffff;
    text-shadow: 0 0 12px cyan;
}

#date {
    margin-top: 4px;
    font-size: 14px;
    color: white;
}

#countdown {
    margin-top: 8px;
    font-size: 14px;
    color: #38bdf8;
}

#timer {
    color: #00ff99;
    font-weight: bold;
    font-size: 17px;
    display: inline;
}

/* Main Hero Layout */
.hero {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    max-width: 1250px;
    padding: 100px 40px 40px 40px;
    gap: 40px;
    z-index: 2;
}

.hero-left {
    flex: 1;
}

.tag {
    display: inline-block;
    padding: 8px 18px;
    border: 1px solid cyan;
    border-radius: 30px;
    color: #00ffff;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 20px;
}

.hero h1 {
    font-size: 56px;
    color: white;
    line-height: 1.15;
    margin-bottom: 15px;
}

.hero h1 span {
    color: #00ffff;
    display: inline;
}

#typing {
    font-size: 28px;
    color: #38bdf8;
    min-height: 40px;
    line-height: 1.3;
    margin-bottom: 20px;
    font-weight: 500;
}

.hero-text {
    font-size: 17px;
    color: #cbd5e1;
    line-height: 1.7;
    margin-bottom: 35px;
    max-width: 540px;
}

.hero-btns {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.btn1, .btn2 {
    padding: 14px 30px;
    border-radius: 35px;
    text-decoration: none;
    font-weight: bold;
    font-size: 15px;
    transition: .3s ease;
    display: inline-block;
    text-align: center;
}

.btn1 {
    background: #00ffff;
    color: #020617;
    border: 2px solid #00ffff;
}

.btn2 {
    border: 2px solid cyan;
    color: white;
    background: transparent;
}

.btn1:hover, .btn2:hover {
    transform: translateY(-3px);
    box-shadow: 0 0 20px cyan;
}

.hero-right {
    display: flex;
    justify-content: center;
    align-items: center;
}

.hero-circle {
    width: 330px;
    height: 330px;
    border-radius: 50%;
    border: 3px solid cyan;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 40px cyan;
    overflow: hidden;
}

.hero-circle img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* ==================== MOBILE & TABLET RESPONSIVE ==================== */
@media screen and (max-width: 900px) {
    body {
        height: auto;
        overflow-y: auto;
        padding-top: 130px;
        padding-bottom: 40px;
    }

    .clock-container {
        top: 15px;
        right: 50%;
        transform: translateX(50%);
        width: 90%;
        max-width: 320px;
        text-align: center;
        padding: 10px 15px;
    }

    #clock {
        font-size: 22px;
    }

    #date {
        font-size: 12px;
    }

    #countdown {
        font-size: 13px;
    }

    .hero {
        flex-direction: column-reverse;
        padding: 20px 20px;
        text-align: center;
        gap: 30px;
    }

    .hero-left {
        width: 100%;
    }

    .tag {
        font-size: 12px;
        padding: 6px 14px;
        margin-bottom: 15px;
    }

    .hero h1 {
        font-size: 36px;
        margin-bottom: 10px;
    }

    #typing {
        font-size: 21px;
        min-height: 32px;
        margin-bottom: 15px;
        white-space: normal;
    }

    .hero-text {
        font-size: 15px;
        line-height: 1.5;
        margin: 0 auto 25px auto;
        max-width: 100%;
    }

    .hero-btns {
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: 100%;
    }

    .btn1, .btn2 {
        width: 90%;
        max-width: 280px;
        padding: 12px 20px;
    }

    .hero-circle {
        width: 200px;
        height: 200px;
    }

    .circle {
        display: none;
    }
}
</style>

</head>

<body>

<div class="clock-container">
    <div id="clock"></div>
    <div id="date"></div>
    <div id="countdown">
        Redirecting in <span id="timer">10</span> sec...
    </div>
</div>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<section class="hero">

    <!-- Left Side -->
    <div class="hero-left">
        <p class="tag">🚀 AI SOFTWARE DEVELOPER</p>
        <h1>Hi, I'm <span>Ayush</span></h1>
        <h2 id="typing"></h2>
        <p class="hero-text">
            Building Modern Web Applications with Python,
            Flask, SQL, AI and Data Analytics.
        </p>

        <div class="hero-btns">
            <a href="/dashboard" class="btn1">🚀 Explore Portfolio</a>
            <a href="#" class="btn2">📄 Download Resume</a>
        </div>
    </div>

    <!-- Right Side -->
    <div class="hero-right">
        <div class="hero-circle">
            <img src="{{ url_for('static', filename='image/profile.jpg') }}" alt="Ayush">
        </div>
    </div>

</section>

<script>
const words = [
    "Full Stack Python Developer",
    "Flask Developer",
    "AI Enthusiast",
    "Data Analyst",
    "SQL Developer"
];

let i = 0;
let j = 0;
let current = "";
let isDeleting = false;

function type() {
    current = words[i];

    if (!isDeleting) {
        j++;
    } else {
        j--;
    }

    document.getElementById("typing").textContent = current.substring(0, j);

    if (!isDeleting && j === current.length) {
        isDeleting = true;
        setTimeout(type, 1200);
        return;
    }

    if (isDeleting && j === 0) {
        isDeleting = false;
        i++;
        if (i === words.length) {
            i = 0;
        }
    }

    setTimeout(type, isDeleting ? 50 : 100);
}

type();

/* ===== Live Clock ===== */
function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerHTML = now.toLocaleTimeString();
    document.getElementById("date").innerHTML = now.toDateString();
}

updateClock();
setInterval(updateClock, 1000);

/* ===== Countdown ===== */
let seconds = 10;
const timer = document.getElementById("timer");

const countdown = setInterval(() => {
    seconds--;
    timer.innerHTML = seconds;

    if (seconds <= 0) {
        clearInterval(countdown);
        window.location.href = "/dashboard";
    }
}, 1000);
</script>

</body>
</html>
