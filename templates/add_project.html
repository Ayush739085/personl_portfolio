<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Project</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            padding: 30px 20px;
            border-radius: 15px;
        }

        h2 {
            text-align: center;
            color: #58d5ff;
            margin-top: 0;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
            color: #000;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #58d5ff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Add Project</h2>
    <form action="/add-project" method="POST">
        <input type="text" name="title" placeholder="Project Title" required>
        <textarea name="description" placeholder="Project Description" rows="4" required></textarea>
        <input type="text" name="github" placeholder="GitHub Link" required>
        <button type="submit">Add Project</button>
    </form>
</div>

</body>
</html>
